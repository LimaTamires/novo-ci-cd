<style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; background-color: #f7f9fc; color: #333; }
    
    .navbar { background-color: #2c3e50; padding: 15px 20px; }
    .navbar a { color: white; text-decoration: none; font-weight: bold; }
    
    .container { max-width: 500px; margin: 60px auto; background-color: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; }
    
    h2 { color: #2c3e50; margin-top: 0; }
    
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
    
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
    input:focus, textarea:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.3); }
    
    button { background-color: #27ae60; color: white; padding: 15px; border: none; border-radius: 6px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { background-color: #219150; }
</style>

<div class="navbar">
    <a href="{% url 'detalhes_destino' destino.id %}">⬅ Voltar ao Destino</a>
</div>

<div class="container">
    <h2>Solicite seu Orçamento</h2>
    <p>Destino escolhido: <strong>{{ destino.nome }}</strong></p>

    <form method="POST" style="margin-top: 30px;">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Qual é o seu nome?</label>
            <input type="text" name="nome" placeholder="Ex: João da Silva" required>
        </div>
        
        <div class="form-group">
            <label>Seu melhor e-mail:</label>
            <input type="email" name="email" placeholder="contato@email.com" required>
        </div>
        
        <div class="form-group">
            <label>Detalhes da Viagem:</label>
            <textarea name="mensagem" rows="5" placeholder="Quantas pessoas? Alguma data em mente?" required></textarea>
        </div>
        
        <button type="submit">Enviar Solicitação</button>
    </form>
</div>
